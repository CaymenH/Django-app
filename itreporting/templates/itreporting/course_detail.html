{% extends "itreporting/base.html" %}
{% block content %}
{% load crispy_forms_tags %}

<h1>{{ course.name }}</h1>
<h2>Modules Offered</h2>
<ul>
  {% for module in modules %}
    <li>{{ module.code }} - {{ module.name }}</li>
  {% empty %}
    <li>No modules available for this course.</li>
  {% endfor %}
</ul>
{% endblock %}
