{% extends "itreporting/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1>Welcome to the module page</h1>
<ul>
{% for module in modules %}
    <li>
        <a href="{% url 'itreporting:module-detail' module.pk %}">
            {{ module.code }} – {{ module.name }}
        </a>
    </li>
{% endfor %}
</ul>
{% endblock %}
